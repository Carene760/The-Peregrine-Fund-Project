name: CI

# Builds and tests both halves of the project on every push/PR. Prepared as
# part of the overnight security/reliability pass - not yet exercised
# against a real GitHub run, review the runner output on the first push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Site (Spring Boot / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-test-reports
          path: Site/target/surefire-reports/
          if-no-files-found: ignore

  android:
    name: application (Android / Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: application/app/build/reports/tests/
          if-no-files-found: ignore
