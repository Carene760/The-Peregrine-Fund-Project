name: Release APK

# Builds a release APK when a version tag (v*) is pushed and attaches it to
# a GitHub Release. Prepared as part of the overnight security/reliability
# pass - not yet exercised against a real GitHub run.
#
# REQUIRED SETUP BEFORE THIS CAN PRODUCE AN INSTALLABLE, UPDATABLE APK:
# Release builds must be signed with a stable keystore (the same one for
# every release) or Android will refuse to let users upgrade in place.
# Add these repo secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   - `base64 -w0 your-release.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without these secrets configured, this workflow builds an UNSIGNED APK
# (see the "Build release APK" step) which Android will not install as an
# upgrade over a previously-signed install. Generate a keystore with:
#   keytool -genkeypair -v -keystore release.keystore -alias tpf -keyalg RSA -keysize 2048 -validity 10000

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # NOTE: app/build.gradle does not yet define a release signingConfig
          # that reads these env vars / release.keystore - this is left as a
          # placeholder wiring point. Add a `signingConfigs { release { ... } }`
          # block reading System.getenv(...) before relying on this step to
          # produce a signed artifact. Until then this produces an unsigned APK.
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: application/${{ steps.apk.outputs.path }}
          generate_release_notes: true
